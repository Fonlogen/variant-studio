<!doctype html>
<html lang="en" data-ui="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%231a1a1e'/><path d='M46 16 33.5 49' stroke='%23ededf0' stroke-width='9' stroke-linecap='round' opacity='.35'/><path d='M18 16 30.5 49' stroke='%238b9cff' stroke-width='9' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/_ui/app.css">
<!--VS_STATIC-->
</head>
<body>
<nav id="rail" data-tip-pos="right" aria-label="Studio">
  <div class="logo" title="Variant Studio"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M50 10 33.5 52" stroke="currentColor" stroke-width="11" stroke-linecap="round" fill="none" opacity=".3"/><path d="M14 10 30.5 52" stroke-width="11" stroke-linecap="round" fill="none" stroke="var(--acc)"/></svg></div>
  <button class="ri" id="rRounds" data-i18n-title="Rounds (R)"></button>
  <button class="ri" id="rShort" data-i18n-title="Shortlist"></button>
  <button class="ri" id="rTree" data-i18n-title="Version tree (T)"></button>
  <button class="ri" id="rOverview" data-i18n-title="Overview (O)"></button>
  <button class="ri" id="rMap" data-i18n-title="Variants map (M)"></button>
  <span class="sp"></span>
  <button class="ri" id="rTeam" data-i18n-title="Team"></button>
  <button class="ri" id="rCmd" data-i18n-title="Commands (Ctrl K)"></button>
  <button class="ri" id="rSettings" data-i18n-title="Settings"></button>
  <span class="conn" id="conn"></span>
</nav>

<aside id="drawer" aria-label="Rounds">
  <div class="dr-h"><b data-i18n="Rounds"></b><small id="proj"></small></div>
  <div class="dr-s"><input class="tx" id="railQ" type="search" data-i18n-title="Filter rounds…" data-i18n-ph="Filter rounds…" aria-label="Filter rounds"></div>
  <ul id="tree"></ul>
</aside>

<main id="main">
  <header id="top">
    <div class="ttl">
      <div class="crumb" id="crumb"></div>
      <h1 id="q"></h1>
    </div>
    <div class="tools">
      <div class="seg" id="viewSeg" role="group"></div>
      <button class="pillbtn" id="vpBtn"></button>
      <div id="stateBox"></div>
      <span class="vsep"></span>
      <button class="ib" id="themeBtn"></button>
      <button class="ib" id="pickBtn"></button>
      <button class="ib" id="editBtn"></button>
      <button class="ib" id="inspBtn"></button>
      <span id="agent" class="agent" role="status"></span>
    </div>
  </header>
  <div id="banner"></div>
  <div id="stage"><button class="newpill" id="newpill"></button><div id="view"></div></div>
</main>

<aside id="insp" data-tip-pos="left" aria-label="Inspector">
  <div class="in-h"><div class="seg" id="inspTabs"></div><button class="ib" id="inspClose"></button></div>
  <div class="in-sel"><select class="tx" id="inspSel" aria-label="Variant"></select></div>
  <div class="in-b" id="inspBody"></div>
</aside>

<section id="dock" aria-label="Prompt">
  <div id="sent"></div>
  <div class="dk">
    <div id="chips"></div>
    <div id="refs"></div>
    <div class="dk-row">
      <span id="chosen"></span>
      <button class="ib" id="bAttach"></button>
      <input type="file" id="fileIn" accept="image/*" multiple hidden>
      <textarea id="note" rows="1" aria-label="Note for the agent"></textarea>
      <button class="ib" id="bMic"></button>
      <button class="ib" id="bChips"></button>
      <span class="acts">
        <button class="btn" id="bRevise"></button>
        <button class="btn pri" id="bChoose"></button>
        <button class="ib" id="bMore"></button>
      </span>
    </div>
  </div>
</section>

<div id="pop" role="dialog" aria-modal="false">
  <div class="el" id="popEl"></div>
  <textarea class="tx" id="popText"></textarea>
  <div class="row"><button class="btn ghost sm" id="popLock"></button><span class="sp"></span><button class="btn ghost sm" id="popCancel"></button><button class="btn pri sm" id="popSave"></button></div>
</div>
<div id="menu" role="menu"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="sh-box"><div class="sh-h"><b id="shTitle"></b><button class="ib" id="shClose"></button></div><div class="sh-b" id="shBody"></div></div></div>
<div id="pal" role="dialog" aria-label="Command palette"><div class="pal-box"><input id="palIn" autocomplete="off" spellcheck="false"><ul id="palList" role="listbox"></ul></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/_ui/js/i18n.js"></script>
<script src="/_ui/js/lang/es.js"></script>
<script src="/_ui/js/lang/fr.js"></script>
<script src="/_ui/js/lang/ru.js"></script>
<script src="/_ui/js/tip.js"></script>
<script src="/_ui/js/core.js"></script>
<script src="/_ui/js/views.js"></script>
<script src="/_ui/js/compare.js"></script>
<script src="/_ui/js/panels.js"></script>
<script src="/_ui/js/dock.js"></script>
<script src="/_ui/js/boot.js"></script>
</body>
</html>
