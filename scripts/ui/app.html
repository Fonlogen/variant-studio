<!doctype html>
<html lang="en" data-ui="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant Studio 2.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><rect x='5' y='5' width='10' height='10' fill='%23ff6a1a'/><rect x='17' y='5' width='10' height='10' fill='%23444'/><rect x='5' y='17' width='10' height='10' fill='%23444'/><rect x='17' y='17' width='10' height='10' fill='%23444'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<!--VS_STATIC-->
<style>
:root {
  --bg: #000; --panel: #0a0a0a; --panel-2: #111; --panel-3: #191919;
  --line: #1c1c1c; --line-2: #2a2a2a; --line-3: #3a3a3a;
  --ink: #ededed; --ink-2: #a3a3a3; --ink-3: #6b6b6b;
  --accent: #ff6a1a; --accent-ink: #000; --accent-soft: rgba(255,106,26,.12); --accent-line: rgba(255,106,26,.45);
  --good: #3ecf8e; --bad: #ff5555; --warn: #f5a524; --good-soft: rgba(62,207,142,.10); --good-line: rgba(62,207,142,.55);
  --r: 4px; --r-sm: 2px; --r-lg: 6px;
  --shadow: 0 12px 40px rgba(0,0,0,.6), 0 0 0 1px var(--line-2);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail-w: 252px; --insp-w: 0px; --top-h: 40px;
  color-scheme: dark;
}
:root[data-ui="light"] {
  --bg: #f4f4f4; --panel: #ffffff; --panel-2: #f6f6f6; --panel-3: #ececec;
  --line: #e6e6e6; --line-2: #d6d6d6; --line-3: #bdbdbd;
  --ink: #0a0a0a; --ink-2: #505050; --ink-3: #8a8a8a;
  --accent: #f25c05; --accent-ink: #fff; --accent-soft: rgba(242,92,5,.10); --accent-line: rgba(242,92,5,.45);
  --good: #16a34a; --bad: #dc2626; --warn: #b45309; --good-soft: rgba(22,163,74,.08); --good-line: rgba(22,163,74,.5);
  --shadow: 0 12px 40px rgba(0,0,0,.12), 0 0 0 1px var(--line-2);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 var(--font); color: var(--ink); background: var(--bg); display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--insp-w); grid-template-rows: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; }
body.rail-hidden { --rail-w: 0px; }
body.insp-open { --insp-w: 320px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }
::selection { background: var(--accent); color: var(--accent-ink); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--line-3); }
::-webkit-scrollbar-track { background: transparent; }
.mono { font-family: var(--mono); }
kbd { font: 500 10.5px/1 var(--mono); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 2px 4px; background: var(--panel-2); color: var(--ink-3); }
svg { width: 15px; height: 15px; flex: none; }

/* ---------- generic controls ---------- */
.ib { border: 1px solid transparent; background: none; border-radius: var(--r); width: 28px; height: 28px; display: inline-grid; place-items: center; color: var(--ink-3); flex: none; position: relative; padding: 0; }
.ib:hover { color: var(--ink); background: var(--panel-3); }
.ib[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
.ib:disabled { opacity: .35; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); padding: 1px; gap: 1px; background: var(--panel); }
.seg button { border: 0; background: none; border-radius: var(--r-sm); height: 24px; min-width: 26px; padding: 0 6px; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: center; justify-content: center; white-space: nowrap; }
.seg button:hover { color: var(--ink); background: var(--panel-3); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.vsep { width: 1px; height: 18px; background: var(--line-2); flex: none; }
.btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: var(--r); height: 30px; padding: 0 12px; font-weight: 600; font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--line-3); background: var(--panel-3); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); border-color: var(--accent); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover:not(:disabled) { background: var(--panel-3); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.tag { font: 600 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 5px; border-radius: var(--r-sm); border: 1px solid var(--line-2); color: var(--ink-3); white-space: nowrap; }
.tag.acc { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
input.tx, select.tx, textarea.tx { border: 1px solid var(--line-2); border-radius: var(--r); background: var(--panel); padding: 5px 8px; outline: none; }
input.tx:focus, select.tx:focus, textarea.tx:focus { border-color: var(--accent-line); }

/* ---------- rail ---------- */
#rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
body.rail-hidden #rail { border: 0; }
.brand { display: flex; align-items: center; gap: 9px; height: var(--top-h); padding: 0 12px; border-bottom: 1px solid var(--line); flex: none; }
.brand-mark { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 16px; height: 16px; flex: none; }
.brand-mark i { background: var(--line-3); }
.brand-mark i:first-child { background: var(--accent); }
.brand b { font: 600 12.5px/1 var(--font); letter-spacing: -.01em; white-space: nowrap; }
.brand b span { color: var(--accent); font-family: var(--mono); font-size: 11px; margin-left: 3px; }
.brand small { display: block; color: var(--ink-3); font: 500 10.5px/1 var(--mono); margin-top: 3px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn { margin-left: auto; width: 6px; height: 6px; background: var(--ink-3); flex: none; }
.conn.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
.rail-search { padding: 8px 10px 4px; }
.rail-search input { width: 100%; height: 28px; }
#tree { list-style: none; margin: 0; padding: 4px 6px 16px; overflow: auto; flex: 1; }
.tr-row { width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r); height: 28px; padding: 0 8px; display: flex; align-items: center; gap: 7px; color: var(--ink-2); min-width: 0; }
.tr-row:hover { background: var(--panel-3); color: var(--ink); }
.tr-row[aria-current="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.tr-row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-row .cnt { font: 500 10.5px/1 var(--mono); color: var(--ink-3); }
.tr-g { font-weight: 600; color: var(--ink); margin-top: 6px; }
.tr-g svg.chev { transition: transform .12s; color: var(--ink-3); width: 12px; height: 12px; }
.tr-g.closed svg.chev { transform: rotate(-90deg); }
.tr-sg { color: var(--ink-2); font-size: 12px; }
.tr-n { font: 500 10.5px/1 var(--mono); color: var(--ink-3); min-width: 26px; }
.st { width: 12px; height: 12px; flex: none; display: grid; place-items: center; border: 1.5px solid var(--line-3); border-radius: var(--r-sm); }
.st svg { width: 9px; height: 9px; }
.st.choose { background: var(--good); border-color: var(--good); color: #000; }
.st.revise, .st.remix { border-color: var(--accent-line); color: var(--accent); }
.st.regenerate { border-color: var(--ink-3); color: var(--ink-3); }
.st.gen { border-style: dashed; animation: spin 2.4s linear infinite; }
.st.open { border-color: var(--ink-2); }
.shortlist-row { margin: 4px 0 2px; }
.shortlist-row svg { color: var(--accent); }
.rail-foot { border-top: 1px solid var(--line); padding: 6px; display: flex; gap: 4px; }
.rail-foot .btn { flex: 1; justify-content: space-between; }

/* ---------- main / topbar ---------- */
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; container-type: inline-size; }
#topbar { height: var(--top-h); flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--panel); position: relative; z-index: 15; transition: transform .16s ease, box-shadow .16s; }
body.hdr-hidden #topbar { position: absolute; left: 0; right: 0; top: 0; transform: translateY(-100%); }
body.hdr-hidden.hdr-peek #topbar { transform: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
#hdrZone { position: absolute; left: 0; right: 0; top: 0; height: 8px; z-index: 14; display: none; }
body.hdr-hidden #hdrZone { display: block; }
#hdrZone::after { content: ""; position: absolute; left: 50%; top: 0; width: 48px; height: 3px; background: var(--line-3); transform: translateX(-50%); }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; padding-left: 2px; }
.crumb .path { font: 500 11px/1 var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; flex: 0 1 auto; }
.crumb { min-width: 140px; }
.crumb h1 { margin: 0; font: 600 13px/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tb { display: flex; align-items: center; gap: 4px; flex: none; }
input.vpw { width: 56px; height: 26px; padding: 0 6px; font: 500 11px var(--mono); }
.zoom { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r); height: 28px; }
.zoom .ib { width: 24px; height: 26px; border: 0; }
.zoom button.zl { border: 0; background: none; font: 500 11px/1 var(--mono); color: var(--ink-2); min-width: 40px; height: 26px; padding: 0 2px; }
.zoom button.zl:hover { color: var(--ink); }

#stage { flex: 1; overflow: auto; padding: 14px 16px 96px; position: relative; }
#view { min-height: 100%; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--min, 320px)), 1fr)); align-items: start; }
.grid.side { grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
.grid.single { grid-template-columns: 1fr; max-width: 1800px; margin: 0 auto; }

.strip { display: flex; align-items: center; gap: 8px; margin: 0 auto 10px; max-width: 1800px; min-height: 30px; flex-wrap: wrap; }
.strip .spacer { flex: 1; }
.strip .hint { color: var(--ink-3); font-size: 12px; }
.tabs { display: inline-flex; gap: 2px; }
.tabs button { border: 1px solid var(--line-2); background: var(--panel); border-radius: var(--r); height: 26px; min-width: 28px; padding: 0 8px; font: 600 11.5px/1 var(--mono); color: var(--ink-2); }
.tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.approved-bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--good-line); background: var(--good-soft); border-radius: var(--r); max-width: 1800px; margin: 0 auto 10px; flex-wrap: wrap; }
.approved-bar .ok { width: 20px; height: 20px; display: grid; place-items: center; background: var(--good); color: #000; border-radius: var(--r-sm); }
.approved-bar b { font-weight: 600; }
.approved-bar small { color: var(--ink-3); font-family: var(--mono); font-size: 11px; }

/* ---------- card ---------- */
.card { background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; transition: border-color .12s, box-shadow .12s; min-width: 0; }
.card:hover { border-color: var(--line-3); }
.card.active { border-color: var(--line-3); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.down { opacity: .55; }
.card.approved { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
.card.approved .letter { background: var(--good); color: #000; border-color: var(--good); }
.card.approved .card-h { background: var(--good-soft); }
.ap-badge { display: none; align-items: center; gap: 4px; font: 600 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--good); border: 1px solid var(--good-line); border-radius: var(--r-sm); padding: 3px 5px; white-space: nowrap; }
.ap-badge svg { width: 10px; height: 10px; }
.card.approved .ap-badge { display: inline-flex; }
.card.just-approved { animation: approvedPulse 1.6s ease-out 1; }
@keyframes approvedPulse { 0% { box-shadow: 0 0 0 1px var(--good), 0 0 0 0 var(--good-line); } 40% { box-shadow: 0 0 0 1px var(--good), 0 0 0 14px rgba(62,207,142,0); } 100% { box-shadow: 0 0 0 1px var(--good); } }
.lv-item.approved { border-color: var(--good-line); }
.lv-item.approved .letter { background: var(--good); color: #000; border-color: var(--good); }
.card-h { cursor: pointer; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 5px 0 6px; border-bottom: 1px solid var(--line); min-width: 0; }
.letter { min-width: 24px; height: 24px; padding: 0 4px; flex: none; border-radius: var(--r-sm); display: grid; place-items: center; font: 600 12px/1 var(--mono); background: var(--panel-3); color: var(--ink); border: 1px solid var(--line-2); }
.card.sel .letter { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.card-t { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 8px; }
.card-t b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-t small { color: var(--ink-3); font: 500 10.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-a { display: flex; gap: 0; align-items: center; flex: none; }
.card-a .ib { width: 26px; height: 26px; }
.card-a svg { width: 14px; height: 14px; }
.ib.on-up { color: var(--good); }
.ib.on-down { color: var(--bad); }
.ib.on-star { color: var(--accent); }
.ib.on-star svg { fill: currentColor; }
.badge { font: 600 10px/1 var(--mono); display: none; align-items: center; gap: 4px; padding: 3px 5px; border-radius: var(--r-sm); cursor: pointer; border: 1px solid; white-space: nowrap; background: none; }
.badge.show { display: inline-flex; }
.badge.err { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.badge.aud { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.badge.aud.clean { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.badge svg { width: 11px; height: 11px; }
.notes { padding: 8px 10px; color: var(--ink-2); font-size: 12.5px; border-bottom: 1px solid var(--line); background: var(--panel-2); display: none; }
.notes.show { display: block; }

.pv { position: relative; overflow: hidden; background: var(--panel-2); }
.pv.scroll { overflow: auto; }
.pv iframe { border: 0; display: block; transform-origin: 0 0; background: transparent; }
.zc { position: absolute; right: 6px; bottom: 6px; z-index: 3; display: inline-flex; align-items: center; gap: 0; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line-2); border-radius: var(--r); opacity: 0; transition: opacity .12s; backdrop-filter: blur(6px); }
.pv:hover .zc, .zc.set, .zc:focus-within { opacity: 1; }
.zc .ib { width: 22px; height: 22px; }
.zc .ib svg { width: 12px; height: 12px; }
.zc span { font: 500 10.5px/1 var(--mono); color: var(--ink-2); padding: 0 4px; min-width: 34px; text-align: center; cursor: pointer; }
.zc .dims { color: var(--ink-3); border-right: 1px solid var(--line-2); padding: 0 6px; cursor: default; }
body.mode-pick .card .pv, body.mode-edit .card .pv { outline: 1.5px dashed var(--accent-line); outline-offset: -1.5px; }
.skeleton { height: 200px; display: grid; place-items: center; color: var(--ink-3); font: 500 11px var(--mono); background: linear-gradient(100deg, var(--panel-2) 30%, var(--panel-3) 50%, var(--panel-2) 70%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -150% 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .skeleton, .st.gen { animation: none; } }

.card-f { padding: 8px; display: none; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); }
.card-f.show { display: flex; }
.ann { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ann:empty { display: none; }
.ann li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: start; font-size: 12.5px; }
.ann .dot { width: 18px; height: 18px; border-radius: var(--r-sm); background: var(--accent); color: var(--accent-ink); font: 700 10px/18px var(--mono); text-align: center; }
.ann .el { color: var(--ink-3); font: 500 10.5px var(--mono); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ann .x { border: 0; background: none; color: var(--ink-3); padding: 0 4px; }
textarea.cm { width: 100%; resize: none; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--panel-2); padding: 6px 8px; min-height: 30px; max-height: 160px; font-size: 12.5px; outline: none; }
textarea.cm:focus { border-color: var(--accent-line); }

/* list view */
.listv { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 12px; align-items: start; max-width: 1800px; margin: 0 auto; }
.lv-items { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; }
.lv-item { display: flex; align-items: center; gap: 9px; padding: 5px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--panel); text-align: left; min-width: 0; }
.lv-item:hover { border-color: var(--line-3); }
.lv-item[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.lv-item.sel .letter { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.lv-thumb { width: 72px; height: 48px; flex: none; overflow: hidden; border-radius: var(--r-sm); background: var(--panel-2); border: 1px solid var(--line); position: relative; }
.lv-thumb .pv { pointer-events: none; height: 48px !important; background: none; }
.lv-meta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.lv-meta b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.lv-meta > span { display: flex; gap: 4px; align-items: center; color: var(--ink-3); }
.lv-meta svg { width: 11px; height: 11px; }

/* swipe */
.swipe { background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-lg); overflow: hidden; max-width: 1800px; margin: 0 auto; }
.swipe-h { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.swipe-body { position: relative; overflow: hidden; background: var(--panel-2); }
.swipe-body .layer { position: absolute; inset: 0 auto auto 0; }
.swipe-body .layer.top { z-index: 2; }
.handle { position: absolute; top: 0; bottom: 0; z-index: 3; width: 0; border-left: 1.5px solid var(--accent); cursor: ew-resize; }
.handle::after { content: ""; position: absolute; top: 50%; left: -9px; width: 16px; height: 32px; border-radius: var(--r-sm); background: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.4); transform: translateY(-50%); }
.handle-hit { position: absolute; top: 0; bottom: 0; left: -14px; width: 28px; }
.swipe-tag { position: absolute; top: 8px; z-index: 4; font: 600 11px/1 var(--mono); background: var(--ink); color: var(--bg); padding: 4px 6px; border-radius: var(--r-sm); pointer-events: none; }

.empty { max-width: 520px; margin: 14vh auto; text-align: center; color: var(--ink-2); }
.empty h2 { font: 600 18px/1.3 var(--font); color: var(--ink); margin: 0 0 8px; }
.empty code { background: var(--panel-2); border: 1px solid var(--line-2); padding: 3px 7px; border-radius: var(--r); font: 500 12px var(--mono); }

/* ---------- dock (prompt bar) ---------- */
#dock { position: fixed; left: calc(var(--rail-w) + (100vw - var(--rail-w) - var(--insp-w)) / 2); bottom: 12px; transform: translateX(-50%); z-index: 30; width: min(700px, calc(100vw - var(--rail-w) - var(--insp-w) - 32px)); }
#dockTab { display: flex; margin: 0 auto; align-items: center; gap: 8px; height: 30px; padding: 0 10px 0 8px; border: 1px solid var(--line-2); background: var(--panel); border-radius: var(--r); color: var(--ink-2); box-shadow: var(--shadow); font-size: 12px; max-width: 100%; }
#dockTab:hover { color: var(--ink); border-color: var(--line-3); }
#dockTab .dsel { display: inline-flex; gap: 3px; }

async function addRefs(files) {

async function submit(action) {
  const c = ctx(); if (!c || !c.target) return;
  const d = draft(c.key);
  const variants = {};
  for (const it of c.items) {
    const vd = S.vdata[it.fk];
    const o = {};
    if (vd) {
      if (vd.rating) o.rating = vd.rating > 0 ? 'like' : 'dislike';
      if (vd.comment?.trim()) o.comment = vd.comment.trim();
      if (vd.ann?.length) o.annotations = vd.ann;
      if (vd.tokens && Object.keys(vd.tokens).length) o.tokens = vd.tokens;
      const ed = Object.entries(vd.edits || {});
      if (ed.length) o.text_edits = ed.map(([selector, e]) => ({ selector, before: e.before, after: e.after }));
    }
    const a = S.audit[it.fk];
    if (S.sendAudit && a && a.length && (d.selected.includes(it.key) || action === 'regenerate')) o.audit = a.slice(0, 15).map(i => ({ kind: i.kind, detail: i.detail, selector: i.selector, text: i.text }));

    ...(c.kind === 'shortlist' ? { shortlist: true } : {}),

}

  }
  add('Go', 'Shortlist', () => selectRound(SHORT));
  S.data.rounds.slice().reverse().forEach(r => add('Go', `${rnum(r.id)} ${[r.group, r.subgroup].filter(Boolean).join(' / ')}${r.group ? ' · ' : ''}${r.title}`, () => selectRound(r.id)));
  return L;
}
let palItems = [], palIdx = 0;
function openPalette() { hideMenu(); $('#pal').classList.add('show'); $('#palIn').value = ''; renderPalette(); $('#palIn').focus(); }
function closePalette() { $('#pal').classList.remove('show'); }
function renderPalette() {
  const q = $('#palIn').value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  palItems = commands().filter(cm => words.every(w => (cm.g + ' ' + cm.label).toLowerCase().includes(w))).slice(0, 60);
  palIdx = Math.min(palIdx, Math.max(0, palItems.length - 1));
  const ul = $('#palList'); ul.innerHTML = '';
  palItems.forEach((cm, i) => ul.append(h('li', { role: 'option', 'aria-selected': String(i === palIdx), onclick: () => runPal(i), onmousemove: () => { if (palIdx !== i) { palIdx = i; renderPalette(); } } },
    h('span', { class: 'g' }, cm.g), h('span', { class: 'l' }, cm.label), cm.kbd ? h('kbd', {}, cm.kbd) : null)));
  if (!palItems.length) ul.append(h('li', {}, h('span', { class: 'l', style: 'color:var(--ink-3)' }, 'No matching command')));
  ul.children[palIdx]?.scrollIntoView({ block: 'nearest' });
}
function runPal(i) { const cm = palItems[i]; closePalette(); cm && cm.run(); }
$('#palIn').addEventListener('input', () => { palIdx = 0; renderPalette(); });
$('#palIn').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); palIdx = Math.min(palItems.length - 1, palIdx + 1); renderPalette(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); palIdx = Math.max(0, palIdx - 1); renderPalette(); }
  if (e.key === 'Enter') { e.preventDefault(); runPal(palIdx); }
  if (e.key === 'Escape') closePalette();
});
$('#pal').addEventListener('pointerdown', (e) => { if (e.target.id === 'pal') closePalette(); });

// ---------------- keyboard ----------------
addEventListener('keydown', (e) => {
  const ae = document.activeElement;
  const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(ae?.tagName) || ae?.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#pal').classList.contains('show') ? closePalette() : openPalette(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    const c = ctx(); if (!c) return;
    const d = draft(c.key); const n = d.selected.length;
    if (c.kind === 'approved') submit('revise');
    else if (n === 1 && !(d.note || '').trim()) submit('choose');
    else if (n === 1) submit('revise');
    else if (n > 1) submit('remix');
    return;
  }
  if (e.key === 'Escape') {
    if ($('#pal').classList.contains('show')) return closePalette();
    if ($('#menu').classList.contains('show')) return hideMenu();
    if ($('#pop').classList.contains('show')) return closePop();
    if (typing) { ae.blur(); return; }
    if (S.mode) return setMode('');
    if (S.expand) return closeExpand();
    if (document.body.classList.contains('rail-mobile')) return document.body.classList.remove('rail-mobile');
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const c = ctx();
  const k = e.key.toLowerCase();
  if (k === '/') { e.preventDefault(); openDock(true); return; }
  if (k === 'r') return toggleRail();
  if (k === 'h') return toggleHdr();
  if (k === 'p') return $('#bPin').click();
  if (k === 'u') return setUi(S.ui === 'dark' ? 'light' : 'dark');
  if (!c) return;
  if (/^[1-9]$/.test(e.key)) { const it = c.items[Number(e.key) - 1]; if (it) toggleSel(it.key, it.fk); return; }
  const lay = { g: 'grid', s: 'side', f: 'focus', x: 'swipe', l: 'list' }[k];
  if (lay) return setLayout(lay);
  if (k === 'c') return setMode(S.mode === 'pick' ? '' : 'pick');
  if (k === 'e') return setMode(S.mode === 'edit' ? '' : 'edit');
  if (k === 'i') return toggleInsp();
  if (k === 'n') return toggleNotes();
  if (k === 'd') return setTheme(S.theme === 'light' ? 'dark' : 'light');
  if (k === 'z') { if (S.expand) closeExpand(); else if (S.active) openExpand(S.active); return; }
  if (e.key === '+' || e.key === '=') return zoomAll(1);
  if (e.key === '-' || e.key === '_') return zoomAll(-1);
  if (e.key === '0') return zoomAll(0);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const dir = e.key === 'ArrowRight' ? 1 : -1, n = c.items.length; if (!n) return;
    if (S.expand) { const i = c.items.findIndex(it => it.fk === S.expand); S.expand = S.active = c.items[(i + dir + n) % n].fk; renderRound(); }
    else if (S.layout === 'focus') { S.focusIdx = (S.focusIdx + dir + n) % n; renderRound(); }
    else if (S.layout === 'list') { const i = c.items.findIndex(it => it.fk === S.listSel); S.listSel = S.active = c.items[(i + dir + n) % n].fk; renderRound(); }
  }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && S.layout === 'list' && !S.expand) {
    e.preventDefault();
    const dir = e.key === 'ArrowDown' ? 1 : -1, n = c.items.length;
    const i = c.items.findIndex(it => it.fk === S.listSel); S.listSel = S.active = c.items[(i + dir + n) % n].fk; renderRound();
  }
});

// ---------------- live connection ----------------
function connect() {
  if (STATIC) { $('#conn').title = 'Offline gallery'; return; }
  const es = new EventSource('/api/stream');
  const conn = $('#conn');
  es.addEventListener('hello', () => { conn.classList.add('on'); conn.title = 'Live'; $('#banner').classList.remove('show'); refresh(); });
  let pending = null;
  const later = () => { clearTimeout(pending); pending = setTimeout(() => refresh(), 120); };
  es.addEventListener('change', later);
  es.addEventListener('decision', later);
  es.onerror = () => { conn.classList.remove('on'); conn.title = 'Offline'; $('#banner').textContent = 'The preview server stopped. Ask the agent to start it again; this page reconnects on its own.'; $('#banner').classList.add('show'); };
}

// ---------------- boot ----------------
setUi(S.ui);
document.body.classList.toggle('hdr-hidden', !S.hdr);
document.body.classList.toggle('insp-open', S.insp);
if (STATIC) { $('#banner').textContent = 'Offline gallery: decisions are copied to your clipboard so you can paste them into the chat.'; $('#banner').classList.add('show'); }
refresh(true).then(connect);
})();
</script>
