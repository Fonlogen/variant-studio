<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='12' height='12' rx='3' fill='%232F5BFF'/><rect x='18' y='2' width='12' height='12' rx='3' fill='%23c9cede'/><rect x='2' y='18' width='12' height='12' rx='3' fill='%23c9cede'/><rect x='18' y='18' width='12' height='12' rx='3' fill='%23c9cede'/></svg>">
<!--VS_STATIC-->
<style>
:root {
  --ink: #1b1c20; --ink-2: #4a4d57; --ink-3: #8b8e99;
  --paper: #eceef2; --panel: #ffffff; --panel-2: #f6f7f9; --line: #dfe2e8; --line-2: #cfd3dc;
  --accent: #2f5bff; --accent-ink: #ffffff; --accent-soft: #e5ebff;
  --good: #1f9d63; --bad: #d8433b; --warn: #c98a00;
  --radius-lg: 14px; --radius: 9px; --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(20,24,40,.06), 0 4px 16px rgba(20,24,40,.05);
  --font: "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-display: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-ui="light"]) {
    --ink: #e9eaee; --ink-2: #b3b6c0; --ink-3: #7c808c;
    --paper: #141519; --panel: #1c1e23; --panel-2: #23252b; --line: #2d3037; --line-2: #3a3e47;
    --accent: #5b7cff; --accent-soft: #232b48; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 var(--font); color: var(--ink); background: var(--paper); display: grid; grid-template-columns: 248px 1fr; grid-template-rows: 100%; overflow: hidden; }
body.rail-hidden { grid-template-columns: 0 1fr; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- rail ---------- */
#rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
.brand-mark { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 22px; height: 22px; }
.brand-mark i { border-radius: 2px; background: var(--line-2); }
.brand-mark i:first-child { background: var(--accent); }
.brand b { font: 650 15px/1 var(--font-display); letter-spacing: -.01em; }
.brand small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 3px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.conn.on { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
.rail-h { padding: 14px 16px 6px; font-size: 12px; color: var(--ink-3); font-weight: 600; }
#rounds { list-style: none; margin: 0; padding: 0 8px 16px; overflow: auto; flex: 1; }
#rounds li button { width: 100%; text-align: left; background: none; border: 0; border-radius: var(--radius); padding: 8px 10px; display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; align-items: start; }
#rounds li button:hover { background: var(--panel-2); }
#rounds li button[aria-current="true"] { background: var(--accent-soft); }
#rounds .n { grid-row: span 2; font: 600 12px/22px var(--font); color: var(--ink-3); font-variant-numeric: tabular-nums; }
#rounds .t { font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rounds .m { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#rounds li.child button { padding-left: 22px; }
.pill { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.choose { background: color-mix(in srgb, var(--good) 14%, var(--panel)); color: var(--good); border-color: transparent; }
.pill.revise, .pill.remix { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.regenerate { background: color-mix(in srgb, var(--warn) 16%, var(--panel)); color: var(--warn); border-color: transparent; }
.pill.open { background: transparent; }
.rail-foot .kr { display: flex; gap: 3px; align-items: center; margin: 4px 0; }
.rail-foot .kr span { margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-foot { border-top: 1px solid var(--line); padding: 10px 16px; font-size: 12px; color: var(--ink-3); }
kbd { font: 600 11px/1 var(--font); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--panel-2); color: var(--ink-2); }

/* ---------- main ---------- */
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header.round { padding: 18px 28px 10px; display: flex; gap: 16px; align-items: flex-start; }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-sm); width: 32px; height: 32px; display: inline-grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn:hover { border-color: var(--line-2); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
#q { margin: 0; font: 650 22px/1.25 var(--font-display); letter-spacing: -.015em; max-width: 70ch; text-wrap: balance; }
#qsub { margin: 4px 0 0; color: var(--ink-2); max-width: 80ch; }
.meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--ink-3); font-size: 12px; flex-wrap: wrap; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 28px 12px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 10px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.seg button:hover { color: var(--ink); background: var(--panel-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg svg { width: 15px; height: 15px; }
.tb-label { font-size: 12px; color: var(--ink-3); margin-right: -4px; }
.spacer { flex: 1; }
.toggle { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 6px 11px; display: inline-flex; gap: 7px; align-items: center; color: var(--ink-2); }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.toggle svg { width: 15px; height: 15px; }
input.vpw { width: 72px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel); padding: 5px 7px; }
select.tb { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 6px 8px; }

#stage { flex: 1; overflow: auto; padding: 22px 28px 160px; position: relative; }
.grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--min, 340px)), 1fr)); align-items: start; }
.grid.side { grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
.grid.focus { grid-template-columns: 1fr; max-width: 1600px; margin: 0 auto; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; transition: border-color .12s, box-shadow .12s; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.card.down { opacity: .62; }
.card-h { cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.letter { width: 34px; height: 34px; flex: none; border-radius: 9px; display: grid; place-items: center; font: 700 17px/1 var(--font-display); background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
.card.sel .letter { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.card-t { min-width: 0; flex: 1; }
.card-t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-t span { display: block; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-a { display: flex; gap: 4px; align-items: center; }
.mini { border: 0; background: none; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3); position: relative; }
.mini:hover { background: var(--panel-2); color: var(--ink); }
.mini svg { width: 16px; height: 16px; }
.mini.on-up { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.mini.on-down { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.err { color: var(--bad); font-size: 11px; font-weight: 700; display: none; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 99px; background: color-mix(in srgb, var(--bad) 10%, transparent); cursor: help; }
.err.show { display: inline-flex; }
.notes { padding: 8px 12px 0; color: var(--ink-2); font-size: 13px; }
.notes:empty { display: none; }

.pv { position: relative; overflow: hidden; background: var(--panel-2); }
.pv.scroll { overflow: auto; }
.pv iframe { border: 0; display: block; transform-origin: 0 0; background: transparent; }
.pv .dims { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--ink-3); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 1px 6px; border-radius: 4px; pointer-events: none; font-variant-numeric: tabular-nums; }
body.picking .pv { outline: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: -2px; }
.skeleton { height: 220px; display: grid; place-items: center; color: var(--ink-3); background: linear-gradient(100deg, var(--panel-2) 30%, var(--panel) 50%, var(--panel-2) 70%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -150% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

.card-f { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); }
.ann { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ann li { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: start; font-size: 13px; }
.ann .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 11px/20px var(--font); text-align: center; }
.ann .el { color: var(--ink-3); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ann .x { border: 0; background: none; color: var(--ink-3); padding: 0 4px; }
textarea.cm { width: 100%; resize: none; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel-2); padding: 7px 9px; min-height: 34px; max-height: 160px; font-size: 13px; }
textarea.cm:focus { background: var(--panel); border-color: var(--line-2); }

/* swipe */
.swipe { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
.swipe-h { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.swipe-body { position: relative; overflow: hidden; background: var(--panel-2); }
.swipe-body .layer { position: absolute; inset: 0 auto auto 0; }
.swipe-body .layer.top { z-index: 2; }
.handle { position: absolute; top: 0; bottom: 0; z-index: 3; width: 0; border-left: 2px solid var(--accent); cursor: ew-resize; }
.handle::after { content: ""; position: absolute; top: 50%; left: -15px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.25); transform: translateY(-50%); }
.handle-hit { position: absolute; top: 0; bottom: 0; left: -14px; width: 28px; }
.swipe-tag { position: absolute; top: 10px; z-index: 4; font: 700 12px/1 var(--font); background: var(--ink); color: var(--panel); padding: 5px 8px; border-radius: 6px; pointer-events: none; }

/* empty */
.empty { max-width: 560px; margin: 10vh auto; text-align: center; color: var(--ink-2); }
.empty h2 { font: 650 22px/1.3 var(--font-display); color: var(--ink); margin: 0 0 8px; }
.empty code { background: var(--panel); border: 1px solid var(--line); padding: 2px 6px; border-radius: 5px; font-size: 13px; }

/* dock */
#dock { position: fixed; left: calc(248px + 28px); right: 28px; bottom: 18px; z-index: 20; background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 10px 40px rgba(20,24,40,.16); padding: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: end; }
body.rail-hidden #dock { left: 28px; }
.chosen { display: flex; gap: 6px; align-items: center; min-height: 36px; flex-wrap: wrap; max-width: 260px; }
.chosen .lbl { font-size: 12px; color: var(--ink-3); width: 100%; }
.chip { font: 700 13px/1 var(--font-display); background: var(--accent); color: var(--accent-ink); border-radius: 7px; padding: 6px 9px; }
.chip.none { background: var(--panel-2); color: var(--ink-3); font-weight: 500; font-family: var(--font); }
#note { width: 100%; resize: none; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 9px 11px; min-height: 40px; max-height: 140px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 10px; padding: 9px 13px; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, black); }
.sent { grid-column: 1 / -1; display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding: 0 2px; }
.sent.show { display: flex; }
.sent .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.sent.done .spin { animation: none; border-color: var(--good); background: var(--good); }
@keyframes spin { to { transform: rotate(360deg); } }

/* popover + toast + banner */
#pop { position: fixed; z-index: 50; width: 300px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.2); padding: 12px; display: none; }
#pop.show { display: block; }
#pop .el { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; word-break: break-all; }
#pop textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--panel-2); resize: vertical; }
#pop .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
#toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px); z-index: 60; background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 10px; font-weight: 550; transition: transform .2s; }
#toast.show { transform: translateX(-50%) translateY(0); }
#banner { display: none; background: color-mix(in srgb, var(--warn) 16%, var(--panel)); color: var(--ink); padding: 8px 28px; font-size: 13px; border-bottom: 1px solid var(--line); }
#banner.show { display: block; }
#newpill { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; display: none; }
#newpill.show { display: inline-flex; }

@media (max-width: 1560px) {
  #layoutSeg button span { display: none; }
  .tb-label { display: none; }
}
@media (max-width: 900px) {
  body { grid-template-columns: 0 1fr; }
  #rail { display: none; }
  #dock { left: 12px; right: 12px; grid-template-columns: 1fr; }
  .grid.side { grid-template-columns: 1fr; }
  header.round, .toolbar, #stage { padding-left: 14px; padding-right: 14px; }
}
</style>
</head>
<body>
<aside id="rail">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div><b>Variant Studio</b><small id="proj"></small></div>
    <span class="conn" id="conn" title=""></span>
  </div>
  <div class="rail-h" data-i18n="rounds">Rounds</div>
  <ol id="rounds"></ol>
  <div class="rail-foot" id="keys"></div>
</aside>

<main id="main">
  <div id="banner"></div>
  <header class="round">
    <button class="icon-btn" id="railBtn" data-i18n-title="toggleRail"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button>
    <div style="min-width:0;flex:1">
      <h1 id="q"></h1>
      <p id="qsub"></p>
      <div class="meta" id="meta"></div>
    </div>
  </header>
  <div class="toolbar" id="toolbar">
    <div class="seg" role="group" id="layoutSeg"></div>
    <span class="tb-label" data-i18n="viewport">Viewport</span>
    <div class="seg" role="group" id="vpSeg"></div>
    <input class="vpw" id="vpCustom" type="number" min="200" max="3840" step="10" placeholder="px" aria-label="Custom width">
    <select class="tb" id="zoomSel" aria-label="Zoom"></select>
    <div class="seg" role="group" id="themeSeg"></div>
    <select class="tb" id="canvasSel" aria-label="Canvas"></select>
    <span class="spacer"></span>
    <button class="toggle" id="syncBtn" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 2v12M11 2v12M2 5l3-3 3 3M8 11l3 3 3-3"/></svg><span data-i18n="syncScroll">Sync scroll</span></button>
    <button class="toggle" id="pickBtn" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2l9 4.5-4 1.2L6.8 12z"/><path d="M8.5 8.5L13 13"/></svg><span data-i18n="pick">Comment on element</span> <kbd>C</kbd></button>
  </div>
  <div id="stage">
    <button class="btn primary" id="newpill"></button>
    <div id="view"></div>
  </div>
</main>

<section id="dock" aria-label="Decision">
  <div class="chosen" id="chosen"></div>
  <textarea id="note" rows="1"></textarea>
  <div class="actions">
    <button class="btn" id="bRegen"></button>
    <button class="btn" id="bRemix"></button>
    <button class="btn" id="bRevise"></button>
    <button class="btn primary" id="bChoose"></button>
  </div>
  <div class="sent" id="sent"><span class="spin"></span><span id="sentText"></span></div>
</section>

<div id="pop" role="dialog" aria-modal="false">
  <div class="el" id="popEl"></div>
  <textarea id="popText"></textarea>
  <div class="row"><button class="btn" id="popCancel"></button><button class="btn primary" id="popSave"></button></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const STATIC = window.__VS_STATIC__ || null;

// ---------------- i18n ----------------
const T = {
  en: {
    rounds: 'Rounds', toggleRail: 'Toggle rounds', viewport: 'Viewport', syncScroll: 'Sync scroll', pick: 'Comment on element',
    grid: 'Grid', side: 'Side by side', focus: 'Focus', swipe: 'Compare',
    auto: 'Fit', light: 'Light', dark: 'Dark', zoomFit: 'Zoom: fit', canvas: 'Canvas',
    cLight: 'Canvas: soft grey', cWhite: 'Canvas: white', cDark: 'Canvas: dark', cChecker: 'Canvas: transparent', cNone: 'Canvas: page',
    component: 'Component', section: 'Section', page: 'Page', variants: n => `${n} variants`, from: n => `from #${n}`,
    open: 'Open', choose: 'Approved', revise: 'Changes', remix: 'Combine', regenerate: 'Start over',
    selected: 'Selected', none: 'Click a variant to select it',
    notePh: 'Tell the agent what to change, keep or combine…',
    bChoose: 'Approve', bRevise: 'Request changes', bRemix: 'Combine', bRegen: 'Start over',
    commentPh: 'Note on this variant…', generating: 'The agent is generating this variant…',
    popPh: 'What should change here?', save: 'Add comment', cancel: 'Cancel',
    rateUp: 'Like', rateDown: 'Dislike', openTab: 'Open in new tab', select: 'Select',
    sent: (a, s) => `Sent to the agent: ${a}${s ? ' ' + s : ''}. Waiting for the next round…`,
    received: (a, s) => `The agent received: ${a}${s ? ' ' + s : ''}.`,
    copied: 'Decision copied. Paste it into the chat with your agent.',
    newRound: 'New round from the agent', goNew: 'New round available — show it',
    offline: 'The preview server stopped. Ask the agent to start it again; this page reconnects on its own.',
    staticMode: 'Offline gallery: decisions are copied to your clipboard so you can paste them into the chat.',
    errors: n => `${n} error${n > 1 ? 's' : ''}`,
    emptyT: 'No rounds yet', emptyP: 'When the agent creates design variants they appear here automatically.',
    keys: 'Keys', send: 'Send decision', swipeHint: 'Drag the handle to compare',
    pickHint: 'Click any element in a preview to comment on it. Esc to stop.',
  },
  it: {
    rounds: 'Round', toggleRail: 'Mostra/nascondi round', viewport: 'Viewport', syncScroll: 'Scroll sincronizzato', pick: 'Commenta elemento',
    grid: 'Griglia', side: 'Affiancate', focus: 'Una alla volta', swipe: 'Confronta',
    auto: 'Adatta', light: 'Chiaro', dark: 'Scuro', zoomFit: 'Zoom: adatta', canvas: 'Sfondo',

    h('div', { class: 'card-a' }, ...nav, up, down, ext)));
  card.append(h('div', { class: 'notes' }, v.notes || ''));

  if (!v.ready || (STATIC && !v.html && !v.url)) {
    card.append(h('div', { class: 'skeleton' }, t('generating')));
  } else {
    let f = frames.get(key);
    if (!f || f.mtime !== v.mtime) f = makeFrame(r, v);
    card.append(f.wrap);
    updateErr(f);
  }
  const ann = h('ol', { class: 'ann', 'data-ann': v.id });
  const cm = h('textarea', { class: 'cm', rows: 1, placeholder: t('commentPh') });
  cm.value = vd.comment || '';
  cm.addEventListener('input', () => { vd.comment = cm.value; autoGrow(cm); persist(); renderDock(); });
  card.append(h('div', { class: 'card-f' }, ann, cm));
  requestAnimationFrame(() => autoGrow(cm));
  paintCard(card, v.id);
  return card;
}
function paintCard(card, vid) {
  const d = draft(); const vd = vdraft(vid);
  card.classList.toggle('sel', d.selected.includes(vid));
  card.classList.toggle('down', vd.rating < 0 && !d.selected.includes(vid));
  card.querySelector('[data-rate=up]')?.classList.toggle('on-up', vd.rating > 0);
  card.querySelector('[data-rate=down]')?.classList.toggle('on-down', vd.rating < 0);
  const ol = card.querySelector('.ann'); ol.innerHTML = '';
  vd.ann.forEach((a, i) => ol.append(h('li', {},
    h('span', { class: 'dot' }, i + 1),
    h('span', {}, a.note, h('span', { class: 'el' }, `${a.tag}${a.text ? ' “' + a.text + '”' : ''}`)),
    h('button', { class: 'x', title: 'Remove', onclick: () => { vd.ann.splice(i, 1); persist(); paintCard(card, vid); const f = frames.get(S.roundId + '/' + vid); if (f) sendFrame(f); renderDock(); } }, '×'))));
}
function updateCards() { document.querySelectorAll('.card[data-vid]').forEach(c => paintCard(c, c.dataset.vid)); }
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 160) + 'px'; }

function toggleSel(vid) {
  const d = draft();
  const i = d.selected.indexOf(vid);
  if (i >= 0) d.selected.splice(i, 1); else d.selected.push(vid);
  persist(); updateCards(); renderDock();
}
function rate(vid, val) {
  const vd = vdraft(vid);
  vd.rating = vd.rating === val ? 0 : val;
  persist(); updateCards(); renderDock();
}

// ---------------- swipe compare ----------------
let swipeState = null;
function buildSwipe(r) {
  const ready = r.variants.filter(v => v.ready);
  const d = draft();
  const pickA = S.swipeA && ready.find(v => v.id === S.swipeA) || ready.find(v => v.id === d.selected[0]) || ready[0];
  const pickB = S.swipeB && ready.find(v => v.id === S.swipeB) || ready.find(v => v.id === d.selected[1] && v !== pickA) || ready.find(v => v !== pickA) || ready[0];
  if (!pickA) return h('div', { class: 'skeleton' }, t('generating'));
  S.swipeA = pickA.id; S.swipeB = pickB.id;
  const sel = (cur, on) => { const s = h('select', { class: 'tb' }); ready.forEach(v => s.append(h('option', { value: v.id, selected: v.id === cur }, `${v.id.toUpperCase()} — ${v.label}`))); s.onchange = () => on(s.value); return s; };
  const fa = makeFrame(r, pickA); const fb = makeFrame(r, pickB);
  fa.swipe = fb.swipe = true;
  // left side = A (top layer clipped), right side = B
  fa.wrap.classList.add('layer', 'top'); fb.wrap.classList.add('layer');
  const handle = h('div', { class: 'handle' }, h('div', { class: 'handle-hit' }));
  const tagA = h('span', { class: 'swipe-tag', style: 'left:10px' }, pickA.id.toUpperCase());
  const tagB = h('span', { class: 'swipe-tag', style: 'right:10px' }, pickB.id.toUpperCase());
  const body = h('div', { class: 'swipe-body' }, fb.wrap, fa.wrap, handle, tagA, tagB);
  const box = h('div', { class: 'swipe' },
    h('div', { class: 'swipe-h' }, sel(pickA.id, v => { S.swipeA = v; renderRound(true); }), h('span', { style: 'color:var(--ink-3)' }, 'vs'), sel(pickB.id, v => { S.swipeB = v; renderRound(true); }), h('span', { class: 'spacer' }), h('span', { style: 'font-size:12px;color:var(--ink-3)' }, t('swipeHint'))),
    body);
  swipeState = { body, fa, fb, handle };
  let drag = false;
  const move = (x) => { const rc = body.getBoundingClientRect(); S.swipePos = Math.max(0, Math.min(100, (x - rc.left) / rc.width * 100)); layoutSwipe(); };
  handle.addEventListener('pointerdown', (e) => { drag = true; handle.setPointerCapture(e.pointerId); body.style.pointerEvents = 'none'; handle.style.pointerEvents = 'auto'; });
  handle.addEventListener('pointermove', (e) => drag && move(e.clientX));
  handle.addEventListener('pointerup', () => { drag = false; body.style.pointerEvents = ''; });
  body.addEventListener('dblclick', (e) => move(e.clientX));
  return box;
}
function layoutSwipe() {
  if (!swipeState || !swipeState.body.isConnected) return;
  const { body, fa, fb, handle } = swipeState;
  const w = body.clientWidth;
  layoutFrame(fa, w); layoutFrame(fb, w);
  const H = Math.max(parseFloat(fa.wrap.style.height) || 0, parseFloat(fb.wrap.style.height) || 0);
  body.style.height = H + 'px';
  fa.wrap.style.width = fb.wrap.style.width = w + 'px';
  fa.wrap.style.clipPath = `inset(0 ${100 - S.swipePos}% 0 0)`;
  handle.style.left = S.swipePos + '%';
}

// ---------------- annotations popover ----------------
let popCtx = null;
function openPop(f, d) {
  popCtx = { f, d };
  const rc = f.wrap.getBoundingClientRect();
  const sc = (f.iframe.getBoundingClientRect().width / f.iframe.offsetWidth) || 1;
  const x = Math.min(innerWidth - 316, Math.max(8, rc.left + (d.rect.x + d.rect.w) * sc + 8));
  const y = Math.min(innerHeight - 180, Math.max(8, rc.top + d.rect.y * sc));
  const pop = $('#pop');
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
  $('#popEl').textContent = `${f.vid.toUpperCase()} · <${d.tag}> ${d.text ? '“' + d.text + '”' : d.selector}`;
  $('#popText').value = ''; $('#popText').placeholder = t('popPh');
  pop.classList.add('show');
  $('#popText').focus();
}
function closePop() { $('#pop').classList.remove('show'); popCtx = null; }
$('#popCancel').textContent = t('cancel');
$('#popSave').textContent = t('save');
$('#popCancel').onclick = closePop;
$('#popSave').onclick = () => {
  if (!popCtx) return;
  const note = $('#popText').value.trim();
  if (note) {
    const { f, d } = popCtx;
    vdraft(f.vid).ann.push({ selector: d.selector, tag: d.tag, text: d.text, note });
    persist(); updateCards(); sendFrame(f); renderDock();
  }
  closePop();
};
$('#popText').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('#popSave').click(); if (e.key === 'Escape') closePop(); });

// ---------------- dock / decisions ----------------
const note = $('#note');
note.placeholder = t('notePh');
note.addEventListener('input', () => { draft().note = note.value; autoGrow(note); persist(); renderDock(); });
$('#bChoose').textContent = t('bChoose'); $('#bRevise').textContent = t('bRevise'); $('#bRemix').textContent = t('bRemix'); $('#bRegen').textContent = t('bRegen');
$('#bChoose').onclick = () => submit('choose');
$('#bRevise').onclick = () => submit('revise');
$('#bRemix').onclick = () => submit('remix');
$('#bRegen').onclick = () => submit('regenerate');

function renderDock() {
  const r = round(); if (!r) return;
  const d = draft();
  if (document.activeElement !== note) { note.value = d.note || ''; autoGrow(note); }
  const ch = $('#chosen'); ch.innerHTML = '';
  ch.append(h('span', { class: 'lbl' }, t('selected')));
  if (!d.selected.length) ch.append(h('span', { class: 'chip none' }, t('none')));
  d.selected.forEach(id => ch.append(h('span', { class: 'chip' }, id.toUpperCase())));
  const n = d.selected.length;
  $('#bChoose').disabled = n !== 1;
  $('#bRevise').disabled = n < 1;
  $('#bRemix').disabled = n < 2;
  const sent = $('#sent');
  if (r.decision) {
    const s = (r.decision.selected || []).join('+').toUpperCase();
    sent.classList.add('show');
    sent.classList.toggle('done', !!r.decision.consumed);
    $('#sentText').textContent = r.decision.consumed ? t('received', t(r.decision.action), s) : t('sent', t(r.decision.action), s);
  } else sent.classList.remove('show');
}

async function submit(action) {
  const r = round(); if (!r) return;
  const d = draft();
  const variants = {};
  for (const v of r.variants) {
    const vd = d.v[v.id];
    if (!vd) continue;
    const o = {};
    if (vd.rating) o.rating = vd.rating > 0 ? 'like' : 'dislike';
    if (vd.comment?.trim()) o.comment = vd.comment.trim();
    if (vd.ann?.length) o.annotations = vd.ann;
    if (Object.keys(o).length) variants[v.id] = { label: v.label, ...o };
  }
  const payload = {
    round: r.id, action,
    selected: d.selected.slice(),
    note: (d.note || '').trim(),
    variants,
    viewed_at: { viewport: currentVpKey(r), theme: S.theme, layout: S.layout },
  };
  if (STATIC) {
    const text = 'Variant Studio decision:\n```json\n' + JSON.stringify(payload, null, 2) + '\n```';
    try { await navigator.clipboard.writeText(text); } catch {
      const ta = h('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    r.decision = { ...payload, consumed: false };
    toast(t('copied'));
    renderRail(); renderDock();
    return;
  }
  const res = await fetch('/api/decision', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!res.ok) { toast('Error ' + res.status); return; }
  S.follow = true;
  await refresh();
}

// ---------------- keyboard ----------------
addEventListener('keydown', (e) => {
  const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    const n = draft().selected.length;
    if (n === 1 && !(draft().note || '').trim()) submit('choose');
    else if (n === 1) submit('revise');
    else if (n > 1) submit('remix');
    return;
  }
  if (typing) return;
  const r = round(); if (!r) return;
  if (e.key === 'Escape') { if (S.pick) setPick(false); closePop(); return; }
  if (/^[1-9]$/.test(e.key)) { const v = r.variants[Number(e.key) - 1]; if (v) toggleSel(v.id); return; }
  const k = e.key.toLowerCase();
  if (k === 'g') { S.layout = 'grid'; persist(); renderRound(true); }
  if (k === 's') { S.layout = 'side'; persist(); renderRound(true); }
  if (k === 'f') { S.layout = 'focus'; persist(); renderRound(true); }
  if (k === 'x') { S.layout = 'swipe'; persist(); renderRound(true); }
  if (k === 'c') setPick(!S.pick);
  if (k === 'd') { $('#themeSeg button:not([aria-pressed=true])')?.click(); }
  if (S.layout === 'focus' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    S.focusIdx = (S.focusIdx + (e.key === 'ArrowRight' ? 1 : -1) + r.variants.length) % r.variants.length; renderRound();
  }
});

// ---------------- live connection ----------------
function connect() {
  if (STATIC) return;
  const es = new EventSource('/api/stream');
  const conn = $('#conn');
  es.addEventListener('hello', () => { conn.classList.add('on'); conn.title = 'Live'; $('#banner').classList.remove('show'); refresh(); });
  let pending = null;
  const later = () => { clearTimeout(pending); pending = setTimeout(() => refresh(), 120); };
  es.addEventListener('change', later);
  es.addEventListener('decision', later);
  es.onerror = () => { conn.classList.remove('on'); conn.title = 'Offline'; $('#banner').textContent = t('offline'); $('#banner').classList.add('show'); };
}

refresh(true).then(connect);
})();
</script>
</body>
